<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">Ternet logo</title>
  <desc id="desc">Ternet neon cyber programming language emblem with a futuristic T, orbit ring, stars, and TERNET wordmark.</desc>
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="0.38" stop-color="#19d8ff"/>
      <stop offset="0.55" stop-color="#57ff6a"/>
      <stop offset="0.76" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="900" rx="96" fill="#020714"/>

  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="450" cy="355" r="278" stroke-width="16"/>
    <ellipse cx="450" cy="390" rx="305" ry="82" transform="rotate(-17 450 390)" stroke-width="23"/>
    <path d="M286 179h328l-62 68H348l-62-68z" stroke-width="8"/>
    <path d="M363 252h174v250l-87 102-87-102V252z" stroke-width="12"/>
    <path d="M450 78v39M450 593v39" stroke-width="10"/>
  </g>

  <g fill="url(#neon)" filter="url(#glow)">
    <path d="M450 112l10 22 22 10-22 10-10 22-10-22-22-10 22-10z"/>
    <path d="M450 600l9 19 19 9-19 9-9 19-9-19-19-9 19-9z"/>
  </g>

  <g fill="url(#neon)" opacity="0.9">
    <circle cx="206" cy="334" r="5"/>
    <circle cx="694" cy="334" r="5"/>
    <circle cx="242" cy="525" r="4"/>
    <circle cx="658" cy="525" r="4"/>
  </g>

  <text x="450" y="770" text-anchor="middle" fill="url(#neon)" font-family="Arial, Helvetica, sans-serif" font-size="105" font-weight="900" letter-spacing="9">TERNET</text>
  <text x="450" y="815" text-anchor="middle" fill="#b8c7dc" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="5">PROGRAMMING LANGUAGE</text>
</svg>
