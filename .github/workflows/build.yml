name: Ternet Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tnc-linux-x64
          - os: windows-latest
            artifact: tnc-windows-x64
          - os: macos-latest
            artifact: tnc-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/tnc dist/tnc
          chmod +x dist/tnc
          tar -czf "${{ matrix.artifact }}.tar.gz" -C dist tnc

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/tnc.exe dist/tnc.exe
          Compress-Archive -Path dist/tnc.exe -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.zip

  tooling:
    name: Validate tooling and repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ternet repository metadata
        run: python3 scripts/validate_repo.py

      - name: Validate VS Code extension JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [
              Path('vscode/ternet-language/package.json'),
              Path('vscode/ternet-language/language-configuration.json'),
              Path('vscode/ternet-language/syntaxes/ternet.tmLanguage.json'),
              Path('vscode-ternet/package.json'),
              Path('vscode-ternet/language-configuration.json'),
              Path('vscode-ternet/syntaxes/ternet.tmLanguage.json'),
          ]:
              json.loads(p.read_text(encoding='utf-8'))
              print(f'valid JSON: {p}')
          PY

      - name: Validate frontend TypeScript build
        run: |
          npm install --no-audit --no-fund
          npm run build
